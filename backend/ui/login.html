<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Mono Cromat</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#081c30;background:radial-gradient(circle at 75% 15%,#d9f1ea,transparent 34%),#f5f6f2;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,920px);display:grid;grid-template-columns:1fr 1fr;min-height:560px;border-radius:14px;overflow:hidden;box-shadow:0 25px 70px #081c301a}.left{background:linear-gradient(145deg,#081c30,#2e48a1);padding:45px;color:white;display:flex;flex-direction:column;justify-content:space-between}.left img{width:135px;filter:brightness(0) invert(1)}.small{font:10px monospace;letter-spacing:.16em;color:#7be9d6}.left h1{font-size:37px;line-height:1.12;letter-spacing:-.045em;font-weight:600}.left p{font-size:13px;color:#c8dbe4;line-height:1.7}.right{background:#ffffffdf;padding:55px 48px}.right h2{font-size:28px;letter-spacing:-.04em;margin:14px 0}.right p{font-size:13px;color:#83949a;margin-bottom:40px}label{display:block;font:10px monospace;letter-spacing:.1em;margin:20px 0 8px;color:#6b858f}input{width:100%;border:1px solid #dbe6e7;background:#fff;padding:14px;border-radius:5px;font:14px inherit}button{margin-top:26px;background:#2e48a1;color:white;border:0;width:100%;padding:15px;border-radius:5px;font-weight:600;cursor:pointer}.error{color:#a52e45;font-size:12px;min-height:20px;margin-top:14px}.footer{font:10px monospace;color:#90a4a5;margin-top:50px}@media(max-width:650px){.wrap{grid-template-columns:1fr}.left{min-height:200px;padding:25px}.left h1{font-size:25px;margin:20px 0 5px}.right{padding:30px}.left p{margin-bottom:0}}</style></head><body><div class="wrap"><div class="left"><div><img src="/logo.png" alt="Mono Cromat & Co."><div class="small">ESTUDIO CREATIVO / OS</div></div><div><div class="small">✳ &nbsp; HECHO PARA CREAR</div><h1>Las ideas empiezan aquí.</h1><p>Un espacio para crear, organizar y hacer avanzar cada proyecto.</p></div><div class="small">MONO CROMAT & CO.</div></div><main class="right"><div class="small" style="color:#438b95">ACCESO AL ESTUDIO</div><h2>Entra a tu espacio.</h2><p>Usa tu correo y contraseña para continuar.</p><form id="form"><label for="email">CORREO</label><input id="email" type="email" autocomplete="username" required><label for="password">CONTRASEÑA</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Entrar al estudio ↗</button><div id="error" class="error" role="alert"></div></form><div class="footer">LIFT YOUR VISION / MONO CROMAT & CO.</div></main></div><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();let button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(!r.ok){let b=await r.json().catch(()=>({}));error.textContent=b.error||'No fue posible iniciar sesión.';return}location.href='/';}catch(e){error.textContent='No fue posible conectar. Inténtalo de nuevo.'}finally{button.disabled=false}};</script></body></html>
